name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-14
            artifact: rst-aarch64-macos
          - target: x86_64-macos
            runner: macos-13
            artifact: rst-x86_64-macos
          - target: aarch64-linux
            runner: ubuntu-24.04
            artifact: rst-aarch64-linux
          - target: x86_64-linux
            runner: ubuntu-24.04
            artifact: rst-x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build --release -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/rst dist/${{ matrix.artifact }}
          (cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }})

      - name: PTY test (native targets only)
        if: ${{ matrix.target != 'aarch64-linux' }}
        run: python3 scripts/pty-test.py zig-out/bin/rst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
